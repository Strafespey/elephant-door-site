<!-- Newsletter signup (Buttondown, account "strafespey"). Shown on the home page, the blog index, every post,
     /warlock and /press. RSS-to-email in Buttondown (Settings > RSS) should point at
     https://elephantdoorstudios.com/feed.xml so every blog post goes out as an email. -->
<section class="newsletter" id="newsletter">
  <h2>Newsletter</h2>
  <form
    action="https://buttondown.com/api/emails/embed-subscribe/strafespey"
    method="post"
    class="embeddable-buttondown-form"
  >
    <label for="bd-email">Enter your email</label>
    <input type="email" name="email" id="bd-email" />
    <input type="submit" value="Subscribe" />
  </form>
</section>
